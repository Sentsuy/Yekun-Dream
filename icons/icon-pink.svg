<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <radialGradient id="glow-pink" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#f472b6" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#1c121a" stop-opacity="0"/>
    </radialGradient>
    <filter id="softGlow-pink" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Squircle Base Tile -->
  <rect width="128" height="128" rx="28" fill="#1c121a" stroke="#48293f" stroke-width="3"/>
  <rect width="128" height="128" rx="28" fill="url(#glow-pink)"/>

  <!-- Dream Star (Celestial Crest) -->
  <path d="M64 16 L68 28 L80 32 L68 36 L64 48 L60 36 L48 32 L60 28 Z"
        fill="#f472b6" filter="url(#softGlow-pink)"/>
  <circle cx="64" cy="32" r="2.5" fill="#ffffff"/>

  <!-- Open Manga Pages -->
  <!-- Left Page -->
  <path d="M63 48 C48 42 32 44 24 50 L24 96 C32 90 48 88 63 94 Z"
        fill="#34192b" stroke="#f472b6" stroke-width="3" stroke-linejoin="round"/>
  <!-- Right Page -->
  <path d="M65 48 C80 42 96 44 104 50 L104 96 C96 90 80 88 65 94 Z"
        fill="#34192b" stroke="#f472b6" stroke-width="3" stroke-linejoin="round"/>

  <!-- Page Lines / Reading Ribbons -->
  <path d="M32 62 C40 58 48 58 55 61" stroke="#ec4899" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
  <path d="M32 72 C40 68 48 68 55 71" stroke="#ec4899" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
  <path d="M32 82 C40 78 48 78 55 81" stroke="#ec4899" stroke-width="2" stroke-linecap="round" opacity="0.8"/>

  <path d="M73 61 C80 58 88 58 96 62" stroke="#ec4899" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
  <path d="M73 71 C80 68 88 68 96 72" stroke="#ec4899" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
  <path d="M73 81 C80 78 88 78 96 82" stroke="#ec4899" stroke-width="2" stroke-linecap="round" opacity="0.8"/>

  <!-- Central Spine / Bookmark -->
  <line x1="64" y1="46" x2="64" y2="98" stroke="#f472b6" stroke-width="4" stroke-linecap="round"/>
  <circle cx="64" cy="98" r="3" fill="#f472b6"/>
</svg>
