<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 280" width="440" height="280">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0d14"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <!-- Accent Glow -->
    <radialGradient id="glow" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>

    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background Surface -->
  <rect width="440" height="280" rx="0" fill="url(#bgGrad)"/>
  <circle cx="220" cy="110" r="160" fill="url(#glow)"/>

  <!-- Subtle Border / Frame -->
  <rect x="1" y="1" width="438" height="278" fill="none" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Central Icon Mark -->
  <g transform="translate(192, 45)" filter="url(#shadow)">
    <!-- Shield / Book Backing -->
    <rect x="0" y="0" width="56" height="56" rx="14" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
    <!-- Book Vector -->
    <path d="M12 40.5A4.5 4.5 0 0 1 16.5 36H44" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M16.5 13H44v27H16.5A4.5 4.5 0 0 1 12 35.5v-27A4.5 4.5 0 0 1 16.5 13z" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Star Diamond -->
    <path d="M28 20L31 24L35 27L31 30L28 34L25 30L21 27L25 24Z" fill="#38bdf8"/>
  </g>

  <!-- Title / Brand Name -->
  <text x="220" y="142" text-anchor="middle" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="28" font-weight="800" letter-spacing="2" fill="#ffffff" filter="url(#shadow)">
    YEKUN <tspan fill="url(#brandGrad)">DREAM</tspan>
  </text>

  <!-- Subtitle Tagline -->
  <text x="220" y="172" text-anchor="middle" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="13" font-weight="500" fill="#94a3b8">
    Gerenciador de Leitura &amp; Streaming
  </text>

  <!-- Feature Pills -->
  <g transform="translate(42, 205)">
    <!-- Pill 1: Animes & Mangás -->
    <rect x="0" y="0" width="108" height="28" rx="14" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="54" y="18" text-anchor="middle" font-family="'Inter', system-ui, sans-serif" font-size="10.5" font-weight="600" fill="#38bdf8">◈ Animes &amp; Mangás</text>

    <!-- Pill 2: Auto-Tracker 70% -->
    <rect x="118" y="0" width="118" height="28" rx="14" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="177" y="18" text-anchor="middle" font-family="'Inter', system-ui, sans-serif" font-size="10.5" font-weight="600" fill="#38bdf8">🎬 Auto-Tracker 70%</text>

    <!-- Pill 3: Notificações -->
    <rect x="246" y="0" width="110" height="28" rx="14" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="301" y="18" text-anchor="middle" font-family="'Inter', system-ui, sans-serif" font-size="10.5" font-weight="600" fill="#38bdf8">🔔 Lançamentos</text>
  </g>

  <!-- Footer Tag -->
  <text x="220" y="260" text-anchor="middle" font-family="'Inter', system-ui, sans-serif" font-size="10" font-weight="500" fill="#64748b">
    100% Livre &amp; Local-First • por Sentsuy
  </text>
</svg>
